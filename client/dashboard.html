<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Mobility India Private Limited &middot; Transport Desk</title>
  <link rel="stylesheet" href="/css/app.css?v=clear-action-flow-3">
</head>
<body>

<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="mark"><img src="/assets/smipl-logo-official.png" alt="Select Mobility India Private Limited"></div>
      <div>
        <div class="title">Select Mobility India</div>
        <div class="sub">Private Limited &middot; TMS</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <strong>Select Mobility India Private Limited</strong>
      Employee Transportation Division
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
      <div>
        <div class="page-title" id="page-title">Dashboard</div>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="command-search" id="command-search">
        <span class="command-search-icon">&#8981;</span>
        <input id="command-input" type="search" placeholder="Search trips, drivers or vehicles" autocomplete="off" aria-label="Search trips, drivers or vehicles">
        <kbd>/</kbd>
        <div class="command-results" id="command-results" hidden></div>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="print-btn" title="Print current view">&#128424;</button>
      <button class="icon-btn" id="alerts-btn" title="Compliance alerts">&#128276;</button>
      <div class="user-chip" id="user-chip" title="Account and session">
        <div class="avatar" id="user-avatar">--</div>
        <div>
          <div class="who" id="user-name">Loading</div>
          <div class="role" id="user-role"></div>
        </div>
      </div>
      <button class="icon-btn" id="logout-btn" title="Sign out">&#9099;</button>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

  <!-- Load order matters: api.js defines the shared helpers used by every page. -->
  <script src="/js/api.js?v=tab-session-2"></script>
  <script src="/js/pages/dashboard.js?v=clear-action-flow-3"></script>
  <script src="/js/pages/trips.js"></script>
  <script src="/js/pages/manifests.js"></script>
  <script src="/js/pages/requests.js"></script>
  <script src="/js/pages/tracking-map-v2.js"></script>
  <script src="/js/pages/routes.js"></script>
  <script src="/js/pages/vehicles.js"></script>
  <script src="/js/pages/employees.js"></script>
  <script src="/js/pages/companies.js"></script>
  <script src="/js/pages/resources.js"></script>
  <script src="/js/pages/billing.js"></script>
  <script src="/js/pages/commercials.js"></script>
  <script src="/js/pages/reports.js"></script>
  <script src="/js/app.js?v=preserve-flow-hashes-4"></script>
</body>
</html>
