<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client portal &middot; Select Mobility</title>
<meta name="description" content="Staff roster, trip history, statements and transport requests for Select Mobility client organisations.">
<meta name="theme-color" content="#1b4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMI Client">
<link rel="manifest" href="/manifest-client.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="app">

<header class="appbar">
  <div>
    <h1 id="bar-title">Overview</h1>
    <span class="sub" id="bar-sub">Select Mobility</span>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btn-refresh" aria-label="Refresh">&#8635;</button>
  <button class="icon-btn" id="btn-signout" aria-label="Sign out">&#8594;</button>
</header>

<div id="offline">No connection &mdash; showing the last information we downloaded.</div>

<main class="wrap" id="view" aria-live="polite">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</main>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="overview" aria-current="true">
    <svg viewBox="0 0 24 24"><path d="M4 5h16v11H4z"/><path d="M4 12h16"/><circle cx="8" cy="18.5" r="1.6"/><circle cx="16" cy="18.5" r="1.6"/></svg>
    Live
  </button>
  <button role="tab" data-tab="roster" aria-current="false">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3"/><path d="M3 19c0-3.2 2.7-5.4 6-5.4S15 15.8 15 19"/><path d="M16 6.5h5M16 10h5M16 13.5h5"/></svg>
    Staff
  </button>
  <button role="tab" data-tab="history" aria-current="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
    History
  </button>
  <button role="tab" data-tab="statement" aria-current="false">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
    Statement
  </button>
  <button role="tab" data-tab="requests" aria-current="false">
    <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
    Requests
  </button>
</nav>

<script src="/js/api.js"></script>
<script src="/js/mobile.js"></script>
<script src="/js/client-app.js"></script>
</body>
</html>
