# ============================================================
#  Railway deployment - Select Mobility TMS
#  Docs: https://docs.railway.app/reference/config-as-code
#
#  HOW TO USE
#  1. Push this project to a GitHub repository.
#  2. In Railway: New Project -> Deploy from GitHub repo.
#  3. Railway detects Node.js and runs the build/start commands below.
#  4. Add the variables from "Variables" below in the Railway dashboard.
#  5. Settings -> Networking -> Generate Domain to get a free URL.
#
#  Railway gives limited free credit rather than an always-free tier.
#  Data is wiped on redeploy unless BACKUP_S3_* is configured.
# ============================================================

[build]
builder = "NIXPACKS"
buildCommand = "npm install"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Variables are set in the Railway dashboard (Project -> Variables).
# Required:
#   NODE_VERSION = 22
#   HOST         = 0.0.0.0
#   ADMIN_EMAIL, ADMIN_PASSWORD
#   COMPANY_NAME, COMPANY_CITY
# Recommended (keeps data across redeploys):
#   BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
#   BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY
